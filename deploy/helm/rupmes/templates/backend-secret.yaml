{{- $secretName := printf "%s-backend" (include "rupmes.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingSecretData := dict }}
{{- if $existingSecret }}
{{- $existingSecretData = $existingSecret.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rupmes.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "rupmes.databaseUrl" . | quote }}
  PRODUCTION_INGEST_API_KEY: {{ .Values.backend.env.productionIngestApiKey | quote }}
  INTEGRATION_SECRETS_KEY: {{ .Values.backend.env.integrationSecretsKey | default (get $existingSecretData "INTEGRATION_SECRETS_KEY" | b64dec) | quote }}
