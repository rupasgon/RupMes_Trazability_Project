apiVersion: v1
kind: Service
metadata:
  name: {{ include "rupmes.fullname" . }}-backend
  labels:
    {{- include "rupmes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  selector:
    {{- include "rupmes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
