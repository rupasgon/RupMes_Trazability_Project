apiVersion: v1
kind: Service
metadata:
  name: {{ include "rupmes.fullname" . }}-frontend
  labels:
    {{- include "rupmes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "rupmes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
