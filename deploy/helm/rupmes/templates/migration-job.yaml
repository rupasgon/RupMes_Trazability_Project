{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rupmes.fullname" . }}-migrate
  labels:
    {{- include "rupmes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "rupmes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - >
              python -m alembic upgrade head{{ if .Values.migrationJob.seed }} &&
              python -m rupmes init-db{{ end }}
          env:
            - name: DATABASE_URL
              value: {{ include "rupmes.databaseUrl" . | quote }}
{{- end }}
