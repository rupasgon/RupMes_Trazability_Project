server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # The SPA entry document must always be revalidated.  Its JavaScript files
    # have content hashes, but a cached index.html can otherwise keep clients
    # permanently pinned to an older frontend release.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri /index.html;
  }
}
