[project]
name = "rupmes_trazability"
version = "1.0.0"
description = "MES trazability database schema and tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  "bcrypt>=4.1",
  "alembic>=1.13",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
connector = [
  "PyMySQL>=1.1",
  "pyodbc>=5.1",
  "paho-mqtt>=2.1",
  "asyncua>=1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
